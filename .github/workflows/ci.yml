# Gate for PRs and pushes to main / rebuild. Cheapest first: contract lint and drift, then the test
# suite (endpoints, contract conformance, golden parity with the recorded Streamlit outputs) and the
# frontend typecheck + build in parallel, then the image.
name: ci

on:
  pull_request:
  push:
    branches: [main, rebuild]

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint openapi.yaml
        run: npx -y @redocly/cli@1.34.0 lint openapi.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Dockerfile
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: api/contract.py matches openapi.yaml
        run: scripts/generate-contract.sh && git diff --exit-code api/contract.py

  test:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q -p no:warnings

  web:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"       # same major as the Dockerfile's web stage
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Types from openapi.yaml, tsc --noEmit, vite build
        run: npm run build

  image:
    needs: [test, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bet-app:ci .
      - name: Container answers /health and /api/v1/catalog
        run: |
          docker run -d --name app -p 7860:7860 bet-app:ci
          for i in $(seq 30); do curl -fs localhost:7860/health && break; sleep 1; done
          curl -fsS localhost:7860/api/v1/catalog > /dev/null
          curl -fsS localhost:7860/ | grep -q '<div id="root">'
          docker inspect -f '{{.Config.User}}' app | grep -qx app
